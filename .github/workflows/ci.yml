name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  apk-tools:
    # apktool/jadx gerektiren testler: worker imajında, prod gibi salt okunur dosya sistemiyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t lc-worker -f apps/api/Dockerfile.worker apps/api
      - name: pytest -m tools
        run: >-
          docker run --rm -v "$PWD/apps/api:/src:ro"
          -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_CACHE_DIR=/tmp/uvcache -e HOME=/tmp/home
          --read-only --tmpfs /tmp:size=2g,mode=1777,exec lc-worker
          sh -c 'cp -r /src /tmp/src && cd /tmp/src && rm -rf .venv
          && uv sync --frozen -q && uv run --no-sync pytest -q -m tools -p no:cacheprovider'
