<!DOCTYPE html>
<html lang="tr-TR"><head><meta charset="UTF-8"><title>Ciddi Tanışma &#8211; Evlilik odaklı eşleşme</title>
<link rel="stylesheet" href="/wp-content/plugins/ultimate-member/assets/css/um.css"></head>
<body class="page">
<header><nav><a href="/">Ciddi Tanışma</a><a href="/login/">Üye girişi</a></nav></header>
<main><h1>Evlilik odaklı eşleşme</h1>
<p>Ciddi bir ilişki arayan bekarlar için eş adayı eşleştirme. Platformu kullanmak için 18 yaşından büyük olmalısın.</p>
<form class="um-form" method="post" action="/register/">
  <label for="birth_year">Doğum yılı</label>
  <select id="birth_year" name="birth_year"><option>1980</option><option>1990</option><option>2000</option><option>2005</option></select>
  <label><input type="checkbox" name="age_confirm"> 18 yaşından büyük olduğumu ve kullanım koşullarını kabul ettiğimi onaylıyorum</label>
  <input type="submit" value="Kayıt ol">
</form></main>
<footer><a href="/kullanim-kosullari/">Kullanım Koşulları</a></footer>
</body></html>
