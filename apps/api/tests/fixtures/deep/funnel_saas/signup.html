<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kayıt</title></head>
<body><main><h1>Hesap oluştur</h1>
<form action="/never" method="post" onsubmit="document.title='SUBMITTED'; return false;">
  <label>Ad Soyad * <input name="fullname" required></label>
  <label>E-posta * <input name="email" type="text" required></label>
  <label>Telefon * <input name="phone" required></label>
  <label>Şirket * <input name="company" required></label>
  <label>Unvan <input name="title"></label>
  <label>Kart numarası * <input name="cardNumber" required></label>
  <label>Şifre * <input name="password" type="password" required></label>
  <label>Şifre tekrar * <input name="password2" type="password" required></label>
  <label><input type="checkbox" name="kvkk"> KVKK aydınlatma metnini okudum</label>
  <button type="submit">Kayıt ol</button>
</form></main></body></html>
