<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up</title></head>
<body><main><h1>Create your account</h1>
<a class="social" href="/auth/google">Continue with Google</a>
<form action="/never" method="post" onsubmit="return false;">
  <label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email" required>
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="new-password" required>
  <button type="submit">Create account</button>
</form></main></body></html>
