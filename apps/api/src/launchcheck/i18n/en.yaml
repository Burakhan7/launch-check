# Finding texts: every check_id needs title, description, why_it_matters, fix_steps (list), fix_prompt.
# Tone: plain, non-blaming, clear. Explain technical terms in parentheses.
# Finding texts live in checks/<group>.en.yaml.
checks: {}

# API and scan error messages (shown to the user)
errors:
  internal_error: "Something unexpected went wrong. Please try again in a moment."
  invalid_request: "The request is invalid. Please check what you entered."
  not_found: "This report could not be found. Reports are deleted automatically after 7 days."
  invalid_url: "That doesn't look like a valid web address. Example: https://yoursite.com"
  url_scheme_not_allowed: "We can only scan addresses starting with http:// or https://."
  url_port_not_allowed: "We can only scan sites on standard ports (80 and 443)."
  queue_unavailable: "The scan queue is busy right now. Please try again in a few minutes."
  collector_unavailable: "We can't run this type of scan yet."
  scan_timeout: "The scan took too long and was stopped. The site may be slow or unreachable."
  scan_stale: "The scan didn't finish. Please scan again."
  url_not_public: "This address doesn't belong to a public website (local network or private IP). We can only scan sites reachable from the internet."
  url_unresolvable: "We couldn't find this domain. Please check the address."
  site_unreachable: "We couldn't reach the site. Make sure it's online and reachable from the internet."
  too_many_redirects: "The site redirects too many times, so we stopped the scan."
  rate_limited: "You've run too many scans in a short time. Please try again a bit later."
  site_blocked_bot: "The site uses protection that blocks automated visitors (e.g. a Cloudflare bot check), so we couldn't scan it. If it's your site, you can relax that protection temporarily for the scan."
  site_http_error: "The site's home page returned an error (4xx/5xx). Make sure the site is online and the address is correct."
  consent_required: "To start the scan, you need to confirm that you own this app."
  invalid_file_type: "You can only upload .apk files."
  invalid_apk: "This file doesn't look like a valid Android app (APK)."
  apk_too_large: "The file is too large. You can upload APKs up to 150 MB."
  zip_bomb: "When unpacked, this file exceeds our safety limits (too many or too large contents), so we can't scan it."
  upload_missing: "We couldn't find the uploaded file. Please upload it again."
  apk_decode_failed: "We couldn't open the app. The file may be corrupt or in a format we don't support."
  apk_timeout: "Opening the app took too long and was stopped. It may be a very large app."
  parent_not_found: "We couldn't find the report this deep scan should be based on. Reports are deleted automatically after 7 days."
  parent_not_ready: "A deep scan can only be started from a completed website scan."
  parent_too_old: "This report is too old for a deep scan. Scan the site again first, then start the deep scan."
  invalid_competitor_url: "One of the competitor addresses you entered isn't a valid, public website."
  competitor_same_origin: "You can't enter your own site or one of its subdomains as a competitor."
  invalid_compare_to: "The previous deep scan you want to compare with wasn't found or belongs to another site."
  invalid_category: "The benchmark category you chose wasn't recognised. Pick one from the list."
  deep_rate_limited: "You've reached today's limit of deep scans. You can try again tomorrow."
  queue_full: "The deep scan queue is full right now. Please try again in a little while."

# Phase 2 live progress events (scan_events.key → text). Parameters are filled in with {name}.
deep_events:
  deep.event.started: "Deep scan started."
  deep.event.phase1_copied: "{count} findings from the quick scan were picked up for verification."
  deep.event.module_started: "{module} started."
  deep.event.page_rendered: "Opening on phone and desktop… {done}/{total} pages"
  deep.event.site_blocked: "The site blocked automated visitors with a verification page; we couldn't open the pages in a browser."
  deep.event.lighthouse_run: "Measuring speed… Lighthouse {done}/{total}"
  deep.event.field_data_ok: "Google's real-user data was retrieved."
  deep.event.field_data_missing: "Real-user data wasn't available; speed is judged by our own measurement only."
  deep.event.subdomains_found: "Found {found} subdomains in certificate logs; checked {scanned} of them."
  deep.event.archive_checked: "Reviewed {count} old addresses of the site in the internet archive."
  deep.event.external_partial: "Some external sources (certificate logs, archive, DNS) couldn't be reached; related checks were skipped."
  deep.event.privacy_consent_checked: "Cookie banner and tracking tools checked; measuring accessibility…"
  deep.event.links_checked: "{internal} internal and {external} external links checked."
  deep.event.funnel_walked: "Walked the sign-up and pricing path on a phone ({steps} steps)."
  deep.event.benchmark_started: "Benchmark started: {competitors} competitors and {references} example sites."
  deep.event.module_done: "{module} finished: {found} findings."
  deep.event.module_partial: "{module} hit its time limit; continuing with what it found ({found} findings)."
  deep.event.module_failed: "{module} couldn't be completed; the scan continues with the other parts."
  deep.event.done: "Deep scan finished."

# Display names of phase 2 modules
deep_modules:
  render: "Real visitor view"
  perf: "Speed measurement"
  external: "External visibility"
  links: "Link and meta verification"
  privacy: "Privacy and third-party code"
  funnel: "Sign-up/purchase path"
  llm: "Content review"
  benchmark: "Benchmark"
