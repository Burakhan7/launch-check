# Etki kartları (PHASE2 §8.4, §11) — Faz 1'in critical/high web check'leri, Türkçe.
# Faz 2 raporunda Faz 1 bulgularının kopyaları da etki kartıyla gösterilir.

web.secrets.leaked_key:
  who: "Sitenin kodunu açan herkes, kod tarayan botlar dahil"
  ease: easy
  consequence: "Anahtarı bulan kişi onu senin adına kullanabilir: yapay zekâ/ödeme/e-posta servislerinde fatura çıkarabilir veya verilere erişebilir."
  legal: "Anahtar kişisel verilere erişim sağlıyorsa KVKK kapsamında veri ihlali bildirimi gerekebilir."
  timeline: {today: "Anahtar şu an siteni ziyaret eden herkese açık.", week: "Kod tarayan botlar sızan anahtarları düzenli olarak arar.", month: "Anahtar yenilenmedikçe kötüye kullanım ve fatura riski sürer."}
  fix_minutes: 30
