web.render.broken_images:
  who: "Every visitor who sees the page"
  ease: easy
  consequence: "Empty boxes or broken icons appear where images should be."
  timeline: {today: "Broken images are visible right now.", week: "Your product/service story is incomplete.", month: "The site looks neglected and trust drops."}
  fix_minutes: 20
web.mobile.horizontal_overflow:
  who: "Visitors on phones"
  ease: easy
  consequence: "The page scrolls sideways on phones; text gets cut off and reading or tapping buttons is harder."
  timeline: {today: "Phone visitors see a sideways-scrolling page right now.", week: "Some mobile visitors leave before finishing the page.", month: "Google takes mobile usability problems into account in rankings."}
  fix_minutes: 30
web.mobile.overlapping_elements:
  who: "Visitors on phones"
  ease: easy
  consequence: "Text and buttons overlap; they can't be read or the wrong thing gets tapped."
  timeline: {today: "Overlapping elements are visible right now.", week: "Mis-taps and drop-offs increase.", month: "Mobile conversion lags noticeably behind desktop."}
  fix_minutes: 30
web.mobile.cta_below_fold:
  who: "Visitors on phones"
  ease: easy
  consequence: "The main button isn't on the first screen; visitors may leave without seeing what to do."
  timeline: {today: "On phones the main button isn't visible without scrolling.", week: "Visitors who don't scroll never take action.", month: "Traffic from ads or content brings fewer results."}
  fix_minutes: 30
web.mobile.tap_targets_small:
  who: "Visitors on phones"
  ease: easy
  consequence: "Small links and buttons are hard to tap with a finger; the wrong thing gets tapped."
  timeline: {today: "Small targets are hard to use right now.", week: "Drop-offs in menus and forms increase.", month: "Accessibility and mobile usability scores stay low."}
  fix_minutes: 30
web.ux.custom_404_missing:
  who: "Visitors who follow a wrong or old link"
  ease: easy
  consequence: "Visitors see an error page disconnected from your design and can't find their way back."
  timeline: {today: "Broken links leave visitors on an empty page.", week: "Most of these visitors leave the site.", month: "Traffic from old links is wasted."}
  fix_minutes: 20
web.ux.offline_breaks_page:
  who: "Phone visitors with a weak or dropping connection"
  ease: moderate
  consequence: "When the connection drops, the page goes blank or loads forever; visitors don't understand what happened."
  timeline: {today: "On a weak connection the page may show a blank screen.", week: "Visitors on the move give up.", month: "The app gets a reputation for being unreliable."}
  fix_minutes: 60
web.security.token_in_web_storage:
  who: "Any script running on your site (for example compromised third-party code)"
  ease: moderate
  consequence: "If the session key stored in the browser is read through an XSS flaw, an attacker can get into the user's account."
  legal: "If accounts are taken over, a data breach notification may be required under GDPR/KVKK."
  timeline: {today: "The key is stored where every script on the page can read it.", week: "A single XSS flaw or malicious extension would be enough.", month: "The risk grows with every new third-party script."}
  fix_minutes: 120
web.security.insecure_cookie_flags:
  who: "Someone on the same network or a script running on your site"
  ease: moderate
  consequence: "Missing security flags make the session cookie easier to steal or abuse from other sites."
  timeline: {today: "Cookies are sent with missing protection right now.", week: "Sessions could be stolen on public Wi-Fi or through an XSS.", month: "Account takeover complaints may come in."}
  fix_minutes: 30
web.security.client_only_admin_route:
  who: "Anyone who guesses the admin address or reads it from the code"
  ease: easy
  consequence: "The admin screen is only hidden in the browser; if the service serving the data isn't protected, anyone can perform admin actions."
  legal: "If personal data is visible, a data breach notification may be required under GDPR/KVKK."
  timeline: {today: "The admin page opens without login right now.", week: "Anyone who finds the address could view or change data.", month: "Bots scan well-known admin paths regularly; the chance of discovery grows."}
  fix_minutes: 120
web.security.sourcemap_tree_exposed:
  who: "Anyone curious about your site's source code"
  ease: easy
  consequence: "The app's source code can be read along with its file tree; finding weaknesses and copying business logic gets easier."
  timeline: {today: "Source files can be downloaded right now.", week: "Keys, internal addresses or logic bugs in the code may be found.", month: "Competitors and attackers can study the code."}
  fix_minutes: 15

