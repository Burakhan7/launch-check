# --- external visibility
web.external.forgotten_subdomain:
  who: "Bots and attackers scanning certificate logs"
  ease: easy
  consequence: "An exposed file or key on a forgotten subdomain can be used to reach your main site and data."
  legal: "If personal data was exposed, a data breach notification may be required under GDPR/KVKK."
  timeline: {today: "The subdomain is public and has problems.", week: "Bots constantly scan certificate logs for new addresses.", month: "A key found there could be used to access your main systems."}
  fix_minutes: 45
web.external.subdomain_takeover_risk:
  who: "People looking for unclaimed service names"
  ease: moderate
  consequence: "Someone could publish their own page on this subdomain and run a fake login page under your name."
  timeline: {today: "The DNS record points to an unclaimed service right now.", week: "Records like this are searched for with automated tools.", month: "If taken over, fraud is carried out through your domain."}
  fix_minutes: 10
web.external.email_spoofing:
  who: "Phishing scammers"
  ease: easy
  consequence: "Fake emails such as 'reset your password' or 'invoice' can be sent from your domain; your customers believe they're real."
  timeline: {today: "Your domain is open to spoofed sending right now.", week: "Fake emails could land in your customers' inboxes.", month: "Your real emails may start going to spam too."}
  fix_minutes: 30
web.external.archived_sensitive_paths:
  who: "Anyone browsing old files in the internet archive"
  ease: easy
  consequence: "If keys and passwords from files that were public in the past are still valid, your systems can be accessed."
  legal: "If personal data was exposed, a data breach notification may be required under GDPR/KVKK."
  timeline: {today: "The archive records are public and aren't deleted.", week: "Keys that weren't changed remain usable.", month: "Until the keys are rotated, the risk remains."}
  fix_minutes: 60
web.external.domain_expiry_soon:
  who: "People who track and buy expiring domains"
  ease: easy
  consequence: "If the domain expires, the site and email stop; after a while someone else can buy the domain."
  timeline: {today: "The expiry date is close.", week: "If auto-renew is off, it may expire.", month: "Getting a lost domain back can be hard and expensive."}
  fix_minutes: 10
web.external.cert_expiry_soon:
  who: "Every visitor who opens your site"
  ease: easy
  consequence: "When the certificate expires, browsers show a 'connection not secure' warning and most visitors leave."
  timeline: {today: "The certificate ends soon and doesn't seem renewed.", week: "If it expires, the site sits behind a warning screen.", month: "Apps' API connections break too."}
  fix_minutes: 20

