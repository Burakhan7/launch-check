  ease: easy
  consequence: "Technical values such as 'undefined' or 'NaN' show on screen; the site looks unfinished or unreliable."
  timeline: {today: "Technical values are on screen right now.", week: "Visitors may think the product isn't ready.", month: "A poor first impression reduces return visits."}
