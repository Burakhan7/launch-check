# Impact cards (PHASE2 §8.4, §11) — phase 2 checks, English. No made-up numbers or statistics;
# calm, realistic tone. ease: easy | moderate | hard. fix_minutes: typical fix time (rough
# estimate in minutes; used by the priority plan). legal: omitted when not applicable.

# --- render
web.render.js_runtime_errors:
  who: "Every visitor who opens your site"
  ease: easy
  consequence: "Where the error happens, buttons, forms or content may not work; visitors leave without knowing why."
  timeline: {today: "The error repeats on every page load.", week: "Sign-ups and sales from affected pages quietly drop.", month: "As long as nobody notices, the loss adds up and support requests grow."}
  fix_minutes: 60
web.render.failed_requests:
  who: "Every visitor who opens your site"
  ease: easy
  consequence: "Data or files the page needs don't arrive, so sections look empty or half-finished."
  timeline: {today: "Affected sections look incomplete right now.", week: "Visitors may think the site is broken and not return.", month: "Search engines may show pages with missing content less often."}
  fix_minutes: 45
web.render.spa_deep_link_404:
  who: "Anyone clicking a shared link or coming from Google"
  ease: easy
  consequence: "Pages other than the home page show 'not found' when opened directly; shared links and search visitors are lost."
  timeline: {today: "Inner pages opened directly return an error right now.", week: "Shared links don't work, so word-of-mouth traffic is wasted.", month: "Google may drop these pages from its index."}
