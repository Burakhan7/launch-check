# --- privacy, supply chain, accessibility
web.privacy.trackers_before_consent:
  who: "Your visitors and the data protection authority"
  ease: easy
  consequence: "Visitor data goes to tracking tools before consent; the consent banner loses its purpose."
  legal: "Under GDPR and KVKK, using analytics/advertising cookies without explicit consent carries a risk of fines and complaints."
  timeline: {today: "Every new visitor's data is sent without consent.", week: "A single visitor complaint could trigger an investigation.", month: "The collected data lacks a legal basis."}
  fix_minutes: 60
web.privacy.trackers_after_reject:
  who: "Your visitors and the data protection authority"
  ease: easy
  consequence: "Tracking continues even though the visitor clearly rejected it; their choice is ignored."
  legal: "Processing data despite a rejected consent is a serious violation under GDPR and KVKK, with a risk of complaints and fines."
  timeline: {today: "Every visitor who rejects is still tracked.", week: "A visitor who notices may file a complaint.", month: "The collected data lacks a legal basis."}
  fix_minutes: 60
web.privacy.consent_banner_missing:
  who: "Your visitors and the data protection authority"
  ease: easy
  consequence: "Tracking tools run without any consent; visitors don't know where their data goes."
  legal: "GDPR and KVKK require prior explicit consent for analytics/advertising cookies; otherwise there's a risk of fines."
  timeline: {today: "Every visitor's data is sent without consent.", week: "A complaint could trigger an investigation.", month: "The collected data lacks a legal basis."}
  fix_minutes: 90
web.security.vulnerable_js_library:
  who: "Automated tools scanning for known vulnerabilities"
  ease: moderate
  consequence: "A published vulnerability can be used to run code on your site as the visitor (session theft, fake forms)."
  timeline: {today: "Vulnerable versions are loaded right now.", week: "Automated scans looking for these flaws run every day.", month: "Until the library is updated, the risk remains."}
  fix_minutes: 60
web.security.risky_third_party_script:
  who: "Whoever controls the compromised CDN"
  ease: easy
  consequence: "Code from this source runs on your site like your own: it can redirect visitors to scam sites or steal form data."
  legal: "If visitor data is stolen, a data breach notification may be required under GDPR/KVKK."
  timeline: {today: "The code runs for every visitor right now.", week: "Malicious code could be switched on at any moment.", month: "Search engines and browsers may flag your site as harmful."}
  fix_minutes: 15
web.a11y.axe_violations:
  who: "Visitors using screen readers or keyboards, and people with low vision"
  ease: easy
  consequence: "These visitors can't tell what buttons do or can't fill in forms."
  legal: "In some sectors and public services, accessibility is a legal requirement."
  timeline: {today: "These visitors can't fully use the site right now.", week: "They get stuck in sign-up and purchase steps.", month: "The problem spreads as new pages reuse the same components."}
  fix_minutes: 120

