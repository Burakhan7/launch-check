# Alt alan adı ele geçirme parmak izleri.
#
# Kaynak: "can-i-take-over-xyz" (https://github.com/EdOverflow/can-i-take-over-xyz),
# fingerprints.json, 2026-11-23 itibarıyla. Lisans: CC BY 4.0 — atıf: EdOverflow ve katkıda
# bulunanlar. Liste uyarlandı: sadece CNAME son eki bilinen servisler alındı; kaynakta "Not
# vulnerable" olanlar alınmadı.
#
# Alanlar:
#   cname: CNAME zincirindeki bir adın bitebileceği son ekler
#   fingerprints: servisin "proje/uygulama yok" sayfasında geçen metinler (büyük/küçük harf duyarsız)
#   regex: true ise fingerprints düzenli ifade
#   nxdomain: true ise parmak izi sayfa değil, CNAME hedefinin DNS'te hiç olmaması
#   confidence: vulnerable (kaynakta "Vulnerable") → high; edge (kaynakta "Edge case": servis
#     alan adı doğrulaması veya özel koşul istiyor) → medium
#
# Sadece okuma: hedefe normal bir ziyaretçi gibi ana sayfa isteği atılır; servis asla "claim"
# edilmez.

- service: AWS Elastic Beanstalk
  cname: [elasticbeanstalk.com]
  nxdomain: true
  confidence: vulnerable
- service: AWS S3
  cname: [s3.amazonaws.com, s3-website.amazonaws.com, s3-website-us-east-1.amazonaws.com]
  fingerprints: ["The specified bucket does not exist", "NoSuchBucket"]
  confidence: vulnerable
- service: Microsoft Azure
  cname:
    - cloudapp.net
    - cloudapp.azure.com
    - azurewebsites.net
    - blob.core.windows.net
    - azure-api.net
    - azurehdinsight.net
    - azureedge.net
    - azurecontainer.io
    - database.windows.net
    - azuredatalakestore.net
    - search.windows.net
    - azurecr.io
    - redis.cache.windows.net
    - servicebus.windows.net
    - trafficmanager.net
    - visualstudio.com
  nxdomain: true
  confidence: vulnerable
