# English detection keywords. Matching runs on lower-cased text with word boundaries.
# A trailing "*" means prefix ("diagnos*" → "diagnosis", "diagnosed"); others are whole words.
# None of these is enough on its own; checks combine them with context rules.

# GDPR art.9 special categories of personal data (searched in form field texts)
special_categories:
  religion: [religion, religious, "sect", sects, faith, "denomination*", "worship*", church, mosque]
  politics: [political, politics, "party affiliation", "political party", "political view*", "ideolog*"]
  health: ["health*", "diagnos*", "disabilit*", "medication*", "medical condition*", "illness*", "psychiatr*", "chronic"]
  ethnicity: ["ethnic*", race, racial, "ethnic origin"]
  sexual: ["sexual orientation", "sex life", "sexual life"]
  biometric: ["biometric*", "fingerprint*", "face recognition", "facial recognition"]
  genetic: ["genetic*"]
  criminal: ["criminal record*", "criminal conviction*", "conviction*"]
  union: ["union membership", "trade union*"]

dating:
  strong: ["matchmak*", "dating", "soulmate*", "compatibility test*", "find your match", "find a match"]
  weak: ["marriage*", "partner*", "relationship*", match, matches, "romance*", "single*"]

live_strangers: [random, "stranger*", "match*", anonymous, "new people", "meet people"]

login:
  paths: [login, log-in, signin, sign-in, signup, sign-up, register, auth]
  texts: ["log in", "login", "sign in", "sign up", "create account", "register"]

payment_texts: [cart, checkout, "add to cart", "buy now", "proceed to payment"]

legal_pages: ["privacy*", "terms*", "cookie*", legal, "consent*", "data protection", gdpr, "distance sales"]

explicit_consent: ["explicit consent", "i consent", "i give my consent", consent]
bundled_purposes: ["transfer abroad", "transferred abroad", "international transfer*", "marketing*", "newsletter*", "advertis*", "promotion*"]

multi_step: [continue, next, "next step", step]
cta: ["get started", "start*", "begin", "take the test", "sign up", "join*", "try free"]

placeholders:
  content_words: [name, "first name", "last name", "full name", "company*", "address*", "email*", "e-mail*", "phone*", "date*", "domain*", your, "city", "organization*", "controller"]
  contact_words: [name, "first name", "last name", "full name", "company*", "address*", "email*", "e-mail*", "phone*", "domain*", "organization*", "controller", "registration number"]
  example_domains: [yourdomain, yourcompany, yoursite, example.com, example.org, example.net, domain.com, test.com, "email@", "info@example"]
  draft_phrase_start: [insert, "add your", "enter your", "put your"]
  draft_phrase_end: [here]

transfer:
  section: ["transfer*", "outside the eea", "third countr*", "abroad"]
  consent: ["explicit consent", consent]
  safeguards: ["standard contractual clause*", "adequacy decision*", "appropriate safeguard*", "binding corporate rule*", "data processing agreement*"]
  service_denied: ["cannot be provided", "unable to provide", "cannot provide", "will not be able to use", "cannot use"]
  amendment_refs: []
countries:
  ireland: Ireland
  germany: Germany
  netherlands: Netherlands
  france: France
  "united kingdom": United Kingdom
  "united states": United States
  usa: United States
  singapore: Singapore
  japan: Japan
  india: India
  canada: Canada

# Live media: a media token and a communication token in the same sentence or nearby.
live_media:
  media: [voice, video, "camera*", webcam, "screen shar*", "voice channel*", "audio room*", "voice room*", "microphone*"]
  communication: ["chat*", "call*", "room*", "channel*", "conversation*", "talk*", "hangout*"]

public_community:
  paths: [explore, directory, servers, communities, profiles, members, groups, channels, discover]
  phrases: ["public server*", "public communit*", "create a communit*", "create communit*", "create your server", "join a communit*", "join the communit*"]

downloads:
  link_texts: ["download*", "install*", "get the app", "get it for"]
  beta_labels: [beta, "preview*", "test build*", "test version*", "early access", "insider*"]

pricing_pages: ["pricing", "price*", plan, plans, premium, pro, "upgrade*", "subscription*", "subscribe", "product*", shop, store, checkout, "buy*"]

footer_links:
  privacy: ["privacy*", gdpr]
  cookies: ["cookie*"]
  terms: ["terms*", "conditions*", "user agreement"]
  rules: ["rules", "guidelines", "community guideline*", "content removal*", "takedown*"]
  contact: ["contact*", "get in touch"]
  support: ["support*", "help*", faq]
  refund: ["refund*", "returns*", "cancellation*"]
contact_items: ["contact*", "get in touch", "support*", "help*"]

auth_targets:
  login: [login, log-in, signin, sign-in, signon]
  register: [register, signup, sign-up, join, start, get-started, onboarding]

listing_pages: ["explore*", "browse*", "directory*", "members*", "profiles*", "users*", "servers*", "communities*", "listings*", "sellers*", "products*", "reviews*", "testimonials*", "discover*"]
counter_units: ["member*", "user*", "people", "person", "server*", "communit*", "review*", "comment*", "post*", "listing*", "seller*", "product*", "follower*", "online"]
empty_states: ["no results*", "nothing here yet", "no members yet", "no reviews yet", "be the first", "no items*", "it's empty"]

# Phase 2 / P6 — structured data opportunity signals (never enough on their own; combined with
# page structure such as price or question counts)
structured_data:
  add_to_cart: ["add to cart", "add to bag", "add to basket", "buy now", "buy it now", "order now"]
  faq_headings: [faq, faqs, "frequently asked*", "common questions", "questions*"]

# Phase 2 / P6 — cookie consent banner. Button labels must match fully or as a prefix
consent:
  banner: ["cookie*", consent, gdpr, "privacy*", "tracking"]
  reject: ["reject*", "decline*", deny, "refuse*", "only necessary*", "necessary only", "only essential*", "essential only", "use necessary cookies only", "continue without accepting", "disagree*", "do not accept"]
  settings: ["settings", "cookie settings", "preferences", "customi*", "manage*", "more options"]
  accept: ["accept*", "agree*", "allow*", "got it", "ok"]

# Phase 2 / P7 — funnel walk. Items starting with "/" or "+" are matched as plain text
funnel:
  signup_buttons: ["sign up", signup, "create account", "create an account", "create your account", register, "get started", "start free*", "try free*", "join now"]
  login_buttons: ["log in", login, "sign in"]
  # State-changing or payment-starting buttons: never clicked as CTA (passivity)
  skip_cta: ["add to cart", "add to bag", "add to basket", "buy now", "buy it now", checkout, "order now", "log out", "delete*", "cancel*", unsubscribe]
  vat_excluded: ["excl. vat", "excl vat", "excluding vat", "+ vat", "+vat", "plus vat", "vat not included"]
  free_tier: [free, "free forever", "$0", "0 $"]
  quote: ["contact sales", "request a quote", "get a quote", "talk to sales", "custom pricing", "contact us for pricing"]
  monthly: [monthly, "/mo", "/month", "per month"]
  yearly: [yearly, annually, annual, "/yr", "/year", "per year"]
  consent: ["terms*", "privacy*", gdpr, "i agree*"]
  # Paid plan signal (for the price check; never a finding on its own)
  paid_words: [pricing, "price*", premium, "subscription*", subscribe, plans, "upgrade*", "buy*", paid]
  newsletter: ["newsletter*", subscribe, "updates"]

# Phase 2 / P9 — benchmark: category detection (title, h1, h2, first screen; with meta flags)
benchmark:
  dev_ai_tools: ["developer*", ai, api, sdk, "code*", deploy, database, "integration*", cli, "open source"]
  nonprofit_org: ["donat*", "charity", "nonprofit", "non-profit", "foundation", "volunteer*"]
  ecommerce_brand: ["cart", "shipping", "shop now", "collection*", "new arrivals", "free returns"]
  saas: ["team*", "workflow*", "dashboard*", "automat*", "free trial", "start free*"]
  sections:
    testimonials: ["testimonial*", "what our customers", "loved by", "reviews", "what people say"]
    faq: [faq, faqs, "frequently asked*"]
    pricing: ["pricing", "plans", "simple pricing"]
    features: ["feature*", "why choose*", "everything you need"]
    how_it_works: ["how it works", "in 3 steps", "get started in"]
    integrations: ["integration*"]
    final_cta: ["get started*", "start today", "start free*", "join*", "try it free"]
    logos: ["trusted by", "used by", "our partners", "loved by teams"]
  page_types:
    pricing: [pricing, plans]
    faq: [faq, help, support]
    blog: [blog, news, articles]
    about: [about, "about us", company]
    contact: [contact, "contact us"]
    customers: [customers, "case studies", stories]
    careers: [careers, jobs]
    compare: ["compare", "vs", "alternatives"]
    integrations: [integrations, apps, marketplace]
    status: [status]
    changelog: [changelog, releases, "whats new"]
    docs: [docs, documentation, developers]
  trust_badges: ["soc 2", soc2, gdpr, "iso 27001", hipaa, "pci dss", "ssl secured"]
  user_claims: ["user*", "customer*", "team*", "compan*", "people", "member*"]
  company_info: ["inc.", "ltd", "gmbh", "llc", "registered in"]
  discount: ["save*", "discount*", "%", "months free", "off"]
  highlight: ["most popular", "recommended", "best value", "popular"]
