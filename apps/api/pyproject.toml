[project]
name = "launchcheck"
version = "0.1.0"
description = "Launch Check — vibe coding ile yapılmış uygulamalar için yayın öncesi kontrol aracı"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "defusedxml>=0.7",
    "tldextract>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchcheck"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
# RUF001-003: Türkçe karakterler (ı, ş...) yorum/metinlerde bilinçli olarak kullanılıyor
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501", "ASYNC240"]  # uzun örnek dizeler, testte senkron dosya işlemleri
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "tools: apktool/jadx gerektirir (worker imajında çalışır; araçlar yoksa atlanır)",
]
