# Geliştirme override'ı: hot reload + açık portlar.
# Başlat: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  web:
    build:
      context: ./apps/web
      target: deps
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]

  api:
    command: ["sh", "-c", "alembic upgrade head && uvicorn launchcheck.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"]
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic:/app/alembic
    ports: ["8000:8000"]

  worker:
    command: ["arq", "--watch", "/app/src", "launchcheck.worker.settings.WorkerSettings"]
    read_only: false
    volumes:
      - ./apps/api/src:/app/src

  postgres:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]

  caddy:
    environment:
      DOMAIN: "http://localhost" # dev: düz HTTP, sertifika yok
    ports: ["8080:80"]
